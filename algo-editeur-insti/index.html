<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Algo Éditeur INSTI</title>
    <meta
      name="description"
      content="Éditeur de pseudo-code algorithmique hors ligne. Conçu pour l'apprentissage scolaire."
    />

    <!-- Thème PWA (barre de statut Android) -->
    <meta name="theme-color" content="#0d4293" />

    <!-- Manifeste -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Favicon et icônes -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Support iOS PWA (plein écran + barre de statut) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Algo INSTI" />

    <!-- Support Microsoft -->
    <meta name="msapplication-TileColor" content="#0d4293" />

    <!-- Empeche le zoom sur double-tap sur mobile -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
